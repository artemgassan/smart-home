<aside [tuiNavigationAside]="expanded">
  <header>
    <button
      tuiAsideItem
      type="button"
      [iconStart]="expanded ? '@tui.chevron-left' : '@tui.chevron-right'"
      (click)="expanded = !expanded"
    >
      Smart Home UI
    </button>
  </header>
  <main>
    <button iconStart="@tui.layout-grid" tuiAsideItem type="button">Overview</button>
    <a iconStart="@tui.info" tuiAsideItem> About </a>
  </main>
</aside>
