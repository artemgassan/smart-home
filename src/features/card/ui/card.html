<div tuiAppearance="floating" tuiCardLarge class="container" appCardDirective>
  <header tuiHeader>
    <h2 tuiTitle>{{ getTitle() }}</h2>

    @if (showGroupToggle()) {
      <aside tuiAccessories>
        <input
          tuiSwitch
          type="checkbox"
          [ngModel]="groupState()"
          (ngModelChange)="toggleDevices($event)"
        />
      </aside>
    }
  </header>

  <section [class.horizontal-layout]="getLayout() === Layout.MultiHorizontalDevice">
    @for (item of items(); track item.label) {
      @if (item.type === 'device') {
        <app-device [square]="getLayout() === Layout.MultiHorizontalDevice" [item]="item" />
      } @else if (item.type === 'sensor') {
        <app-sensor [square]="getLayout() === Layout.MultiHorizontalDevice" [item]="item" />
      }
    }
  </section>
</div>
