<div tuiAppearance="floating" tuiCardLarge class="container">
  <header tuiHeader>
    <h2 tuiTitle>{{ title() }}</h2>

    @if (layout() !== Layout.SingleDevice) {
    <aside tuiAccessories>
      <input tuiSwitch type="checkbox" />
    </aside>
    }
  </header>

  <section [class.horizontal-layout]="layout() !== Layout.MultiHorizontalDevice">
    <app-device />
    <app-device />
  </section>
</div>
