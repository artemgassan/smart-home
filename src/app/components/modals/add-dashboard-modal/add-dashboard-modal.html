<form (ngSubmit)="onSubmit()" [formGroup]="form">
  <tui-textfield>
    <label tuiLabel>Dashboard name</label>
    <input
      placeholder="Lights"
      tuiTextfield
      formControlName="name"
    />
  </tui-textfield>
  <tui-textfield>
    <label tuiLabel>Icon</label>
    <input
      placeholder="icon"
      tuiTextfield
      formControlName="icon"
    />
  </tui-textfield>
  <button
    tuiButton
    type="submit"
    appearance="primary"
  >
    Submit
  </button>
</form>
